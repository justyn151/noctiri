# Applications
bind=SUPER,Return,spawn,kitty --config ~/.config/mango/kitty.conf
bind=SUPER+SHIFT,Return,toggle_named_scratchpad,noctiri-yazi,none,kitty --class noctiri-yazi --config ~/.config/mango/kitty.conf yazi
bind=SUPER,space,spawn,fuzzel --config ~/.config/fuzzel/fuzzel.ini
bind=SUPER,d,spawn,fuzzel --config ~/.config/fuzzel/fuzzel.ini
bind=SUPER,b,spawn,firefox
bind=SUPER,e,spawn,dolphin
bind=SUPER,y,toggle_named_scratchpad,noctiri-yazi,none,kitty --class noctiri-yazi --config ~/.config/mango/kitty.conf yazi
bind=SUPER,w,spawn,kitty --title Wi-Fi --class noctiri-network --config ~/.config/mango/kitty.conf nmtui
bind=SUPER+SHIFT,b,spawn,kitty --title Bluetooth --class noctiri-bluetooth --config ~/.config/mango/kitty.conf bluetui
bind=SUPER,t,spawn,kitty --title System --class noctiri-btop --config ~/.config/mango/kitty.conf btop
bind=SUPER,F1,spawn_shell,kitty --title Keybindings --class noctiri-keybinds --config ~/.config/mango/kitty.conf "$HOME/.local/bin/noctiri-keybinds" --hold

# Session and desktop controls
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,Tab,switch_layout
bind=SUPER,m,zoom
bind=SUPER,l,spawn,swaylock -f -c 151c1e
bind=SUPER,Escape,spawn,swaylock -f -c 151c1e
bind=SUPER,n,spawn,swaync-client -t -sw
bind=SUPER+SHIFT,t,spawn_shell,$HOME/.local/bin/noctiri-theme toggle
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,e,quit

# Directional focus and movement
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Nine tags. The active tag is shown as a square in Waybar.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Screen brightness and audio
bind=none,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=none,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioNext,spawn,playerctl next
bind=none,XF86AudioPrev,spawn,playerctl previous

# Screenshots
bind=none,Print,spawn_shell,grim "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png"
bind=SHIFT,Print,spawn_shell,grim -g "$(slurp)" - | swappy -f -

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Noctiri Tatami: a traditional master-stack Mango desktop.
source=./theme.conf
source=./bindings.conf
source=./rules.conf

# Traditional tiling is the default. Scrolling remains deliberately absent
# from the layout cycle so this flavour stays distinct from Niri.
new_is_master=1
default_mfact=0.56
default_nmaster=1
smartgaps=0
circle_layout=tile,grid,monocle,deck

gappih=8
gappiv=8
gappoh=12
gappov=12
borderpx=2
border_radius=6
no_border_when_single=0
no_radius_when_single=0

shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=10
shadows_blur=12
shadows_position_x=0
shadows_position_y=3
shadowscolor=0x00000066
blur=0
blur_layer=0
focused_opacity=1.0
unfocused_opacity=0.97

animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
animation_duration_move=180
animation_duration_open=160
animation_duration_tag=180
animation_duration_close=140
animation_duration_focus=120

focus_on_activate=1
sloppyfocus=0
warpcursor=0
drag_tile_to_tile=1
enable_floating_snap=1
snap_distance=32
cursor_size=22

repeat_rate=30
repeat_delay=450
numlockon=1
xkb_rules_layout=us

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
disable_while_typing=1

env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_QPA_PLATFORM,wayland;xcb
env=MOZ_ENABLE_WAYLAND,1
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,22

exec-once=~/.config/mango/autostart.sh

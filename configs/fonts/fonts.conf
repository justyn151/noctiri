<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Use one coherent Nerd Font family across the Niri desktop. Applications
       that deliberately request a document/web font remain free to do so. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>DepartureMono Nerd Font</family></prefer>
    <accept>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
    </accept>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>DepartureMono Nerd Font</family></prefer>
    <accept>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
    </accept>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>DepartureMono Nerd Font Mono</family></prefer>
    <accept>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Sans CJK SC</family>
    </accept>
  </alias>
  <match target="pattern">
    <test name="family" compare="eq"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DepartureMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>

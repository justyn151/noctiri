[widget.-]
text = "-"
type = "text"

[widget.active_window]
capsule_border = "primary"
capsule_border_width = 0.5
capsule_opacity = 0.0
display = "text_only"
icon_size = 12
max_length = 200
min_length = 0
title_scroll = "always"

[widget.audio_visualizer]
capsule_border = "primary"
capsule_opacity = 0.0

[widget.caffeine]
capsule_border = "primary"

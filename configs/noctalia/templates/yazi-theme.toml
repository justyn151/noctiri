#:schema https://yazi-rs.github.io/schemas/theme.json
# Generated by Noctalia from the active palette. Edit the template in
# ~/.config/noctalia/templates/yazi-theme.toml, not this rendered file.

[app]
overall = { bg = "{{ colors.surface.default.hex }}" }

[mgr]
cwd = { fg = "{{ colors.primary.default.hex }}", bold = true }
find_keyword = { fg = "{{ colors.tertiary.default.hex }}", bold = true, underline = true }
find_position = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
symlink_target = { fg = "{{ colors.secondary.default.hex }}", italic = true }
marker_copied = { fg = "{{ colors.secondary.default.hex }}", bg = "{{ colors.secondary.default.hex }}" }
marker_cut = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.error.default.hex }}" }
marker_marked = { fg = "{{ colors.tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}" }
marker_selected = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
count_copied = { fg = "{{ colors.on_secondary.default.hex }}", bg = "{{ colors.secondary.default.hex }}" }
count_cut = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}" }
count_selected = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
border_symbol = "│"
border_style = { fg = "{{ colors.outline_variant.default.hex }}" }

[tabs]
active = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
inactive = { fg = "{{ colors.on_surface_variant.default.hex }}", bg = "{{ colors.surface_container.default.hex }}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
normal_alt = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
select_main = { fg = "{{ colors.on_tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}", bold = true }
select_alt = { fg = "{{ colors.tertiary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
unset_main = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}", bold = true }
unset_alt = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

[indicator]
parent = { fg = "{{ colors.secondary.default.hex }}" }
current = { fg = "{{ colors.on_primary_container.default.hex }}", bg = "{{ colors.primary_container.default.hex }}", bold = true }
preview = { fg = "{{ colors.tertiary.default.hex }}", underline = true }
padding = { open = "", close = "" }

[status]
overall = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface.default.hex }}" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "{{ colors.outline.default.hex }}" }
perm_type = { fg = "{{ colors.primary.default.hex }}" }
perm_read = { fg = "{{ colors.secondary.default.hex }}" }
perm_write = { fg = "{{ colors.tertiary.default.hex }}" }
perm_exec = { fg = "{{ colors.error.default.hex }}" }
progress_label = { fg = "{{ colors.on_primary.default.hex }}", bold = true }
progress_normal = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_container_highest.default.hex }}" }
progress_error = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}" }

[which]
border = { fg = "{{ colors.primary.default.hex }}" }
cand = { fg = "{{ colors.tertiary.default.hex }}", bold = true }
rest = { fg = "{{ colors.on_surface_variant.default.hex }}" }
separator = " 󰄾 "
separator_style = { fg = "{{ colors.outline.default.hex }}" }

[confirm]
border = { fg = "{{ colors.error.default.hex }}" }
title = { fg = "{{ colors.error.default.hex }}", bold = true }
btn_yes = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}", bold = true }
btn_no = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

[spot]
border = { fg = "{{ colors.primary.default.hex }}" }
title = { fg = "{{ colors.primary.default.hex }}", bold = true }
tbl_col = { fg = "{{ colors.secondary.default.hex }}" }
tbl_cell = { fg = "{{ colors.on_surface.default.hex }}" }

[notify]
title_info = { fg = "{{ colors.primary.default.hex }}" }
title_warn = { fg = "{{ colors.tertiary.default.hex }}" }
title_error = { fg = "{{ colors.error.default.hex }}" }

[pick]
border = { fg = "{{ colors.primary.default.hex }}" }
active = { fg = "{{ colors.tertiary.default.hex }}", bold = true }
inactive = { fg = "{{ colors.on_surface_variant.default.hex }}" }

[input]
border = { fg = "{{ colors.primary.default.hex }}" }
title = { fg = "{{ colors.primary.default.hex }}", bold = true }
value = { fg = "{{ colors.on_surface.default.hex }}" }
selected = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }

[cmp]
border = { fg = "{{ colors.primary.default.hex }}" }
active = { fg = "{{ colors.on_primary_container.default.hex }}", bg = "{{ colors.primary_container.default.hex }}", bold = true }
inactive = { fg = "{{ colors.on_surface_variant.default.hex }}" }

[tasks]
border = { fg = "{{ colors.primary.default.hex }}" }
title = { fg = "{{ colors.primary.default.hex }}", bold = true }
hovered = { fg = "{{ colors.on_primary_container.default.hex }}", bg = "{{ colors.primary_container.default.hex }}", bold = true }

[help]
border = { fg = "{{ colors.primary.default.hex }}" }
chord = { fg = "{{ colors.tertiary.default.hex }}", bold = true }
action = { fg = "{{ colors.on_surface.default.hex }}" }
hovered = { fg = "{{ colors.on_primary_container.default.hex }}", bg = "{{ colors.primary_container.default.hex }}", bold = true }

[filetype]
rules = [
    { url = "*/", fg = "{{ colors.primary.default.hex }}", bold = true },
    { mime = "image/*", fg = "{{ colors.tertiary.default.hex }}" },
    { mime = "{audio,video}/*", fg = "{{ colors.secondary.default.hex }}" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd}", fg = "{{ colors.tertiary.default.hex }}" },
    { mime = "inode/empty", fg = "{{ colors.outline.default.hex }}" },
    { url = "*", is = "orphan", fg = "{{ colors.error.default.hex }}" },
    { url = "*", fg = "{{ colors.on_surface.default.hex }}" },
]

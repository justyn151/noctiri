# Keep this file intentionally small so Yazi can inherit improved upstream defaults.
[mgr]
ratio = [ 1, 3, 4 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 4
image_delay = 30
image_filter = "lanczos3"
image_quality = 80

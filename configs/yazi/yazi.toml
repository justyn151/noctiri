# Keep this file intentionally small so Yazi can inherit improved upstream defaults.
[mgr]
ratio = [ 1, 3, 4 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size_and_mtime"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 4
image_delay = 30
image_filter = "lanczos3"
image_quality = 80
max_width = 1600
max_height = 1600

[opener]
noctiri-edit = [
    { run = 'if command -v nvim >/dev/null 2>&1; then nvim %s; else xdg-open %s1; fi', block = true, desc = "Edit in Neovim" },
]
noctiri-pdf = [
    { run = 'if command -v sioyek >/dev/null 2>&1; then sioyek %s1; else xdg-open %s1; fi', orphan = true, desc = "View PDF" },
]
noctiri-audio = [
    { run = 'if command -v mpv >/dev/null 2>&1; then mpv --force-window=immediate %s; else xdg-open %s1; fi', orphan = true, desc = "Play audio with MPV" },
]
noctiri-video = [
    { run = 'if command -v mpv >/dev/null 2>&1; then mpv %s; else xdg-open %s1; fi', orphan = true, desc = "Play video with MPV" },
]

[open]
prepend_rules = [
    { url = "*.{c,cc,cpp,h,hpp,css,go,html,ini,java,js,json,kdl,lua,md,py,rs,sh,toml,ts,tsx,txt,xml,yaml,yml}", use = [ "noctiri-edit", "open" ] },
    { url = "*.tex", use = [ "noctiri-edit", "open" ] },
    { mime = "application/pdf", use = [ "noctiri-pdf", "open" ] },
    { mime = "audio/*", use = [ "noctiri-audio", "open" ] },
    { mime = "video/*", use = [ "noctiri-video", "open" ] },
]

# The built-in video preview already uses FFmpeg for thumbnails. Audio gets
# an on-demand text preview from ffprobe; no player is started just by browsing.
[[plugin.prepend_previewers]]
mime = "audio/*"
run = 'piper -- ffprobe -v error -select_streams a:0 -show_entries format=duration,size,bit_rate:format_tags=title,artist,album,date,genre:stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 "$1"'

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
